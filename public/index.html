<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Урок</title>
<link rel="stylesheet" href="/vendor/codemirror/codemirror.css">
<style>
  :root { --bg:#f4f6fb; --card:#fff; --text:#1c2333; --muted:#6b7385; --accent:#3b6cf6; --danger:#d93b3b; --ok:#2fb36b; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 20px 16px; }
  body.wide .wrap { max-width: 1300px; padding: 12px; }
  .card { background:var(--card); border-radius:14px; padding:22px; box-shadow:0 2px 14px rgba(20,30,60,.08); }
  h1 { font-size: 22px; margin: 0 0 16px; }
  label { display:block; font-size:14px; color:var(--muted); margin:12px 0 6px; }
  input[type=text] { width:100%; padding:12px 14px; font-size:18px; border:1.5px solid #d5dae6; border-radius:10px; outline:none; }
  input[type=text]:focus, textarea:focus { border-color:var(--accent); }
  #joinBtn { margin-top:18px; width:100%; padding:13px; font-size:17px; border:0; border-radius:10px; background:var(--accent); color:#fff; cursor:pointer; }
  #joinBtn:hover { filter:brightness(1.07); }
  .err { color:var(--danger); font-size:14px; min-height:20px; margin-top:10px; }
  .bar { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  .who { font-weight:600; }
  .status { font-size:13px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--ok); }
  .dot.off { background:#e09a1a; }
  textarea { width:100%; height:60vh; min-height:260px; padding:14px; font-size:18px; line-height:1.5; border:1.5px solid #d5dae6; border-radius:10px; outline:none; resize:vertical; font-family: inherit; }
  textarea:disabled { background:#eceef4; color:#7a8195; }
  .lock { display:none; background:#fff3d6; color:#7a5200; padding:10px 14px; border-radius:10px; margin-bottom:12px; font-size:14px; }
  .hidden { display:none !important; }

  /* Режим Python */
  .toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
  .toolbar button { padding:9px 16px; font-size:15px; border:0; border-radius:9px; cursor:pointer; color:#fff; }
  .toolbar button:disabled { opacity:.45; cursor:not-allowed; }
  #runBtn { background:var(--ok); }
  #stopBtn { background:var(--danger); }
  #clrBtn { background:#e8ecf6; color:var(--text); }
  .pystatus { font-size:13px; color:var(--muted); margin-left:6px; }
  .split { display:grid; grid-template-columns:1fr 1fr; gap:12px; height:70vh; min-height:360px; }
  .pane { display:flex; flex-direction:column; min-height:0; }
  .pt { font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:5px; }
  #editorHost { flex:1; min-height:0; border:1.5px solid #d5dae6; border-radius:10px; overflow:hidden; }
  #editorHost .CodeMirror { height:100%; font-size:15px; font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }
  .term { flex:1; min-height:0; overflow:auto; background:#12161f; color:#e6e9f2; border-radius:10px; padding:12px; font:14px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace; white-space:pre-wrap; word-break:break-word; cursor:text; }
  .term .err { color:#ff8a8a; }
  .term .dim { color:#7f8aa3; }
  .term .usr { color:#9fe3a1; }
  #termIn { background:transparent; border:0; outline:0; color:#9fe3a1; font:inherit; width:70%; min-width:60px; padding:0; caret-color:#fff; }
  .pane { min-width:0; }

  /* Режим HTML / CSS / JS */
  .tabs { display:flex; gap:4px; margin-bottom:0; }
  .tab { padding:8px 16px; font-size:14px; font-weight:600; border:0; border-radius:9px 9px 0 0; background:#e8ecf6; color:var(--text); cursor:pointer; }
  .tab.active { background:var(--accent); color:#fff; }
  .edhost { flex:1; min-height:0; border:1.5px solid #d5dae6; border-radius:0 10px 10px 10px; overflow:hidden; }
  .edhost .CodeMirror { height:100%; font-size:15px; font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }
  .prow { display:flex; align-items:center; gap:10px; min-height:34px; }
  .prow .grow { flex:1; }
  .prow label { margin:0; display:flex; align-items:center; gap:5px; font-size:12px; text-transform:none; letter-spacing:0; color:var(--muted); }
  .mini { padding:5px 11px; font-size:12px; border:0; border-radius:7px; background:#e8ecf6; color:var(--text); cursor:pointer; }
  .preview { flex:1; min-height:0; width:100%; background:#fff; border:1.5px solid #d5dae6; border-radius:10px; }
  .con { margin-top:6px; background:#12161f; color:#e6e9f2; border-radius:10px; max-height:30%; display:flex; flex-direction:column; min-height:60px; }
  .conh { display:flex; justify-content:space-between; align-items:center; padding:4px 10px; font-size:11px; color:#8b94ab; text-transform:uppercase; letter-spacing:.06em; }
  .conh .mini { background:#232a3b; color:#c7cde0; padding:2px 8px; }
  #conOut { overflow:auto; padding:0 10px 8px; font:13px/1.45 ui-monospace, "Cascadia Code", Consolas, monospace; white-space:pre-wrap; word-break:break-word; }
  #conOut .error { color:#ff8a8a; }
  #conOut .warn { color:#ffd479; }

  @media (max-width: 800px) {
    /* телефон: окна одно под другим */
    .split { grid-template-columns:1fr; grid-template-rows:1fr 1fr; height:82vh; height:82dvh; }
    .wrap { padding:8px; }
    .card { padding:12px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div id="join" class="card">
    <h1>Вход на урок</h1>
    <label for="code">Код комнаты</label>
    <input id="code" type="text" inputmode="numeric" maxlength="4" placeholder="1234" autocomplete="off">
    <label for="name">Ваше имя</label>
    <input id="name" type="text" maxlength="40" placeholder="Имя Фамилия" autocomplete="off">
    <button id="joinBtn">Войти</button>
    <div class="err" id="err"></div>
  </div>

  <div id="work" class="card hidden">
    <div class="bar">
      <div class="who" id="who"></div>
      <div class="status"><span class="dot" id="dot"></span><span id="stText">подключено</span></div>
    </div>
    <div class="lock" id="lockMsg">Учитель заблокировал ввод.</div>

    <!-- Режим «Текст» -->
    <div id="textPane">
      <textarea id="area" placeholder="Пишите здесь..." spellcheck="false"></textarea>
    </div>

    <!-- Режим «Python» -->
    <div id="pyPane" class="hidden">
      <div class="toolbar">
        <button id="runBtn" disabled>▶ Запустить</button>
        <button id="stopBtn" disabled>■ Стоп</button>
        <button id="clrBtn">Очистить вывод</button>
        <span class="pystatus" id="pyStatus"></span>
      </div>
      <div class="split">
        <div class="pane">
          <div class="pt">Код (Ctrl+Enter — запуск)</div>
          <div id="editorHost"></div>
        </div>
        <div class="pane">
          <div class="pt">Вывод и ввод</div>
          <div class="term" id="term"><span id="termOut"></span><input id="termIn" class="hidden" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
        </div>
      </div>
    </div>

    <!-- Режим «HTML» -->
    <div id="htmlPane" class="hidden">
      <div class="split">
        <div class="pane">
          <div class="tabs">
            <button class="tab active" data-tab="html">HTML</button>
            <button class="tab" data-tab="css">CSS</button>
            <button class="tab" data-tab="js">JS</button>
          </div>
          <div id="htmlEditorHost" class="edhost"></div>
        </div>
        <div class="pane">
          <div class="pt prow">
            <span>Страница</span><span class="grow"></span>
            <label><input type="checkbox" id="autoRun" checked> автообновление</label>
            <button class="mini" id="htmlRun">▶ Обновить</button>
          </div>
          <iframe id="preview" class="preview" sandbox="allow-scripts allow-modals" title="Страница"></iframe>
          <div id="conBox" class="con hidden">
            <div class="conh"><span>Консоль</span><button class="mini" id="conClr">очистить</button></div>
            <div id="conOut"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>

<script src="/vendor/codemirror/codemirror.js"></script>
<script src="/vendor/codemirror/python.js"></script>
<script src="/vendor/codemirror/closebrackets.js"></script>
<script src="/vendor/codemirror/matchbrackets.js"></script>
<script src="/vendor/codemirror/xml.js"></script>
<script src="/vendor/codemirror/javascript.js"></script>
<script src="/vendor/codemirror/css.js"></script>
<script src="/vendor/codemirror/htmlmixed.js"></script>
<script src="/vendor/codemirror/xml-fold.js"></script>
<script src="/vendor/codemirror/closetag.js"></script>
<script src="/preview.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const ERR = {
    room_not_found: 'Комната с таким кодом не найдена',
    name_required: 'Введите имя',
    room_full: 'В комнате нет мест'
  };
  const MAX_TERM = 20000;

  let ws = null;
  let state = JSON.parse(localStorage.getItem('lt_student') || 'null'); // {code,name,id}
  let joined = false;
  let sendTimer = null;
  let outTimer = null;
  let closedByKick = false;

  let mode = 'text';
  let locked = false;
  let silent = false;          // true — когда код меняем программно, без отправки учителю
  let cm = null;               // редактор CodeMirror

  // --- Python ---
  let pyWorker = null;
  let pyReady = false;
  let pyState = 'idle';        // idle | running | input
  let pyInitError = '';
  let sab = null, ctrl = null, dataArr = null;
  let termText = '';

  function wsUrl() {
    return (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;
  }

  function setStatus(online) {
    $('dot').classList.toggle('off', !online);
    $('stText').textContent = online ? 'подключено' : 'нет связи, переподключаюсь...';
  }

  // ---------- код / текст ----------
  function getCode() { return mode === 'python' && cm ? cm.getValue() : $('area').value; }
  function setCode(v) {
    silent = true;
    $('area').value = v;
    if (cm) cm.setValue(v);
    silent = false;
  }
  function scheduleSend() {
    clearTimeout(sendTimer);
    sendTimer = setTimeout(sendNow, 120);
  }
  function sendNow() {
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'text', text: getCode() }));
  }
  $('area').addEventListener('input', () => { if (!silent) scheduleSend(); });

  function applyLock(l) {
    locked = !!l;
    $('area').disabled = locked;
    if (cm) cm.setOption('readOnly', locked ? 'nocursor' : false);
    if (hcm) hcm.setOption('readOnly', locked ? 'nocursor' : false);
    $('lockMsg').style.display = locked ? 'block' : 'none';
    updateButtons();
  }

  // ---------- режимы ----------
  function setMode(m) {
    if (m !== 'python' && m !== 'html') m = 'text';
    if (m === mode && $('work').dataset.init) return;
    $('work').dataset.init = '1';
    if (mode === 'python') {
      if (cm) { silent = true; $('area').value = cm.getValue(); silent = false; }
      if (pyState !== 'idle') stopCode(true);
    }
    mode = m;
    $('textPane').classList.toggle('hidden', m !== 'text');
    $('pyPane').classList.toggle('hidden', m !== 'python');
    $('htmlPane').classList.toggle('hidden', m !== 'html');
    document.body.classList.toggle('wide', m !== 'text');
    if (m === 'html') {
      initHtmlEditor();
      setTimeout(() => { hcm.refresh(); renderPreview(); }, 0);
    }
    if (m === 'python') {
      initEditor();
      silent = true; cm.setValue($('area').value); silent = false;
      initPython();
      setTimeout(() => cm.refresh(), 0);
    }
    applyLock(locked);
    refreshStatus();
  }

  function initEditor() {
    if (cm) return;
    cm = CodeMirror($('editorHost'), {
      value: $('area').value,
      mode: 'python',
      lineNumbers: true,
      indentUnit: 4,
      indentWithTabs: false,
      matchBrackets: true,
      autoCloseBrackets: true,
      extraKeys: {
        Tab: (c) => c.execCommand('insertSoftTab'),
        'Shift-Tab': (c) => c.execCommand('indentLess'),
        'Ctrl-Enter': () => runCode(),
        'Cmd-Enter': () => runCode()
      }
    });
    cm.on('change', () => { if (!silent) scheduleSend(); });
  }

  // ---------- терминал ----------
  function appendOut(text, kind) {
    if (!text) return;
    termText += text;
    if (termText.length > MAX_TERM) termText = termText.slice(-MAX_TERM);
    const span = document.createElement('span');
    if (kind) span.className = kind;
    span.textContent = text;
    $('termOut').appendChild(span);
    // не даём странице разрастаться
    const out = $('termOut');
    while (out.childNodes.length > 800) out.removeChild(out.firstChild);
    $('term').scrollTop = $('term').scrollHeight;
    scheduleOutput();
  }

  function renderTerm() {
    const out = $('termOut');
    out.textContent = termText;
    $('term').scrollTop = $('term').scrollHeight;
  }

  function clearTerm() {
    termText = '';
    $('termOut').textContent = '';
    scheduleOutput();
  }

  function scheduleOutput() {
    if (outTimer) return;
    outTimer = setTimeout(() => { outTimer = null; sendOutput(); }, 200);
  }
  function sendOutput() {
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'output', output: termText, state: pyState }));
  }

  function showInput() {
    const i = $('termIn');
    i.classList.remove('hidden');
    i.value = '';
    i.focus();
    $('term').scrollTop = $('term').scrollHeight;
  }
  function hideInput() { $('termIn').classList.add('hidden'); }

  $('term').addEventListener('click', () => { if (!$('termIn').classList.contains('hidden')) $('termIn').focus(); });
  $('termIn').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); submitInput(); }
  });

  function submitInput() {
    if (pyState !== 'input' || !ctrl) return;
    const v = $('termIn').value;
    hideInput();
    appendOut(v + '\n', 'usr');
    let bytes = new TextEncoder().encode(v);
    if (bytes.length > 65536) bytes = bytes.slice(0, 65536);
    dataArr.set(bytes);
    Atomics.store(ctrl, 1, bytes.length);
    Atomics.store(ctrl, 0, 1);
    Atomics.notify(ctrl, 0);
    setPyState('running');
  }

  // ---------- Python (Pyodide в воркере) ----------
  function initPython() {
    if (pyWorker) return;
    pyReady = false;
    pyInitError = '';
    const isolated = typeof SharedArrayBuffer !== 'undefined' && self.crossOriginIsolated;
    if (isolated) {
      sab = new SharedArrayBuffer(8 + 65536);
      ctrl = new Int32Array(sab, 0, 2);
      dataArr = new Uint8Array(sab, 8);
    } else {
      sab = null; ctrl = null; dataArr = null;
    }
    try {
      pyWorker = new Worker('/py-worker.js', { type: 'module' });
    } catch (e) {
      pyInitError = 'Ваш браузер не поддерживает запуск Python. Обновите браузер.';
      refreshStatus();
      return;
    }
    pyWorker.onmessage = onPyMessage;
    pyWorker.onerror = () => { pyInitError = 'Не удалось запустить Python. Обновите страницу.'; refreshStatus(); };
    pyWorker.postMessage({ type: 'init', sab });
    refreshStatus();
  }

  function onPyMessage(e) {
    const m = e.data;
    if (m.type === 'ready') {
      pyReady = true;
      setPyState('idle');
    } else if (m.type === 'out') {
      appendOut(m.text, m.err ? 'err' : '');
    } else if (m.type === 'input_request') {
      appendOut(m.prompt, '');
      setPyState('input');
      showInput();
    } else if (m.type === 'done') {
      if (m.error) appendOut((termText && !termText.endsWith('\n') ? '\n' : '') + m.error + '\n', 'err');
      appendOut('\n[Программа завершена]\n', 'dim');
      hideInput();
      setPyState('idle');
    } else if (m.type === 'init_error') {
      pyInitError = 'Не удалось загрузить Python: ' + m.error;
      refreshStatus();
    }
  }

  function setPyState(s) {
    pyState = s;
    updateButtons();
    refreshStatus();
    scheduleOutput();
  }

  function updateButtons() {
    $('runBtn').disabled = !(pyReady && pyState === 'idle' && !locked);
    $('stopBtn').disabled = pyState === 'idle';
  }

  function refreshStatus() {
    let t = '';
    if (pyInitError) t = pyInitError;
    else if (!pyReady) t = 'Загрузка Python… (в первый раз до 30 секунд)';
    else if (pyState === 'running') t = 'Выполняется…';
    else if (pyState === 'input') t = 'Программа ждёт ввода — введите значение справа и нажмите Enter';
    else t = locked ? 'Ввод заблокирован учителем' : 'Готово';
    $('pyStatus').textContent = t;
  }

  function runCode() {
    if (!pyReady || pyState !== 'idle' || locked) return;
    clearTerm();
    setPyState('running');
    pyWorker.postMessage({ type: 'run', code: getCode() });
  }

  function stopCode(noRestart) {
    if (pyWorker) { pyWorker.terminate(); pyWorker = null; }
    pyReady = false;
    hideInput();
    if (pyState !== 'idle') appendOut('\n[Остановлено]\n', 'dim');
    pyState = 'idle';
    updateButtons();
    scheduleOutput();
    if (!noRestart) initPython(); // перезапускаем Python (из кэша браузера — быстро)
    refreshStatus();
  }

  $('runBtn').addEventListener('click', runCode);
  $('stopBtn').addEventListener('click', () => stopCode(false));
  $('clrBtn').addEventListener('click', clearTerm);

  // ---------- HTML / CSS / JS ----------
  let files = { html: '', css: '', js: '' };
  let hcm = null;          // один редактор, внутри три документа (по вкладкам)
  let hdocs = null;
  let hTab = 'html';
  let prevTimer = null;
  let filesTimer = null;

  function readFiles() {
    if (!hdocs) return { html: files.html, css: files.css, js: files.js };
    return { html: hdocs.html.getValue(), css: hdocs.css.getValue(), js: hdocs.js.getValue() };
  }

  function initHtmlEditor() {
    if (hcm) return;
    hdocs = {
      html: CodeMirror.Doc(files.html, 'htmlmixed'),
      css: CodeMirror.Doc(files.css, 'css'),
      js: CodeMirror.Doc(files.js, 'javascript')
    };
    hcm = CodeMirror($('htmlEditorHost'), {
      value: hdocs.html,
      lineNumbers: true,
      indentUnit: 2,
      tabSize: 2,
      indentWithTabs: false,
      matchBrackets: true,
      autoCloseBrackets: true,
      autoCloseTags: true,
      extraKeys: {
        Tab: (c) => c.execCommand('insertSoftTab'),
        'Shift-Tab': (c) => c.execCommand('indentLess'),
        'Ctrl-Enter': () => renderPreview(),
        'Cmd-Enter': () => renderPreview()
      }
    });
    Object.keys(hdocs).forEach((k) => hdocs[k].on('change', onFilesChange));
    hcm.setOption('readOnly', locked ? 'nocursor' : false);
  }

  function onFilesChange() {
    if (silent) return;
    files = readFiles();
    clearTimeout(filesTimer);
    filesTimer = setTimeout(sendFiles, 150);
    schedulePreview();
  }

  function sendFiles() {
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'files', files: readFiles() }));
  }

  function setFiles(f) {
    f = f || {};
    files = { html: f.html || '', css: f.css || '', js: f.js || '' };
    if (hdocs) {
      silent = true;
      ['html', 'css', 'js'].forEach((k) => { if (hdocs[k].getValue() !== files[k]) hdocs[k].setValue(files[k]); });
      silent = false;
    }
    if (mode === 'html') renderPreview();
  }

  document.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => {
    if (!hcm) return;
    hTab = b.dataset.tab;
    document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('active', x === b));
    hcm.swapDoc(hdocs[hTab]);
    hcm.refresh();
    hcm.focus();
  }));

  function renderPreview() {
    clearConsole();
    $('preview').srcdoc = LTPreview.buildDoc(readFiles(), { scripts: true, console: true });
  }
  function schedulePreview() {
    if (!$('autoRun').checked) return;
    clearTimeout(prevTimer);
    prevTimer = setTimeout(renderPreview, 600);
  }
  $('htmlRun').addEventListener('click', renderPreview);
  $('autoRun').addEventListener('change', () => { if ($('autoRun').checked) renderPreview(); });

  // консоль страницы (console.log и ошибки из iframe)
  function clearConsole() {
    $('conOut').textContent = '';
    $('conBox').classList.add('hidden');
  }
  $('conClr').addEventListener('click', clearConsole);
  window.addEventListener('message', (e) => {
    if (e.source !== $('preview').contentWindow) return;
    const d = e.data;
    if (!d || !d.lt) return;
    const line = document.createElement('div');
    line.className = d.t === 'error' ? 'error' : (d.t === 'warn' ? 'warn' : '');
    line.textContent = String(d.m).slice(0, 2000);
    const out = $('conOut');
    out.appendChild(line);
    while (out.childNodes.length > 200) out.removeChild(out.firstChild);
    $('conBox').classList.remove('hidden');
    out.scrollTop = out.scrollHeight;
  });

  // ---------- связь с сервером ----------
  function connect() {
    ws = new WebSocket(wsUrl());
    ws.onopen = () => {
      ws.send(JSON.stringify({ type: 'student_join', code: state.code, name: state.name, id: state.id }));
    };
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === 'student_ready') {
        state.id = m.id;
        localStorage.setItem('lt_student', JSON.stringify(state));
        joined = true;
        $('join').classList.add('hidden');
        $('work').classList.remove('hidden');
        $('who').textContent = state.name + ' · комната ' + state.code;
        locked = !!m.locked;
        setMode(m.mode);
        {
          const lf = readFiles();
          const localEmpty = !lf.html && !lf.css && !lf.js;
          const sf = m.files || {};
          const serverEmpty = !sf.html && !sf.css && !sf.js;
          if (!localEmpty && serverEmpty) sendFiles(); // ученик успел набрать без связи
          else setFiles(sf);
        }
        // не затираем то, что ученик успел набрать без связи
        if (getCode() === '' || m.text !== '') setCode(m.text);
        if (termText === '' && m.output) { termText = m.output; renderTerm(); }
        applyLock(m.locked);
        setStatus(true);
        if (getCode() !== m.text) sendNow();
        sendOutput();
      } else if (m.type === 'mode') {
        setMode(m.mode);
      } else if (m.type === 'lock') {
        applyLock(m.locked);
      } else if (m.type === 'set_text') {
        setCode(m.text);
        if (m.files) setFiles(m.files);
        if (m.clearOutput) clearTerm();
      } else if (m.type === 'kicked') {
        closedByKick = true;
        localStorage.removeItem('lt_student');
        alert('Вас отключил учитель.');
        location.reload();
      } else if (m.type === 'error') {
        if (m.reason === 'room_not_found') localStorage.removeItem('lt_student');
        $('err').textContent = ERR[m.reason] || 'Ошибка';
        if (joined) location.reload();
        closedByKick = true;
        ws.close();
      }
    };
    ws.onclose = () => {
      if (closedByKick) return;
      setStatus(false);
      setTimeout(connect, 1500);
    };
  }

  $('joinBtn').addEventListener('click', start);
  ['code', 'name'].forEach((id) => $(id).addEventListener('keydown', (e) => { if (e.key === 'Enter') start(); }));

  function start() {
    const code = $('code').value.trim();
    const name = $('name').value.trim();
    if (!/^\d{4}$/.test(code)) { $('err').textContent = 'Код — 4 цифры'; return; }
    if (!name) { $('err').textContent = 'Введите имя'; return; }
    $('err').textContent = '';
    state = { code, name, id: (state && state.code === code && state.name === name) ? state.id : null };
    closedByKick = false;
    connect();
  }

  // Автовход после обновления страницы
  if (state && state.code && state.name) {
    $('code').value = state.code;
    $('name').value = state.name;
    connect();
  }

  // Keep-alive, чтобы хостинг не обрывал соединение
  setInterval(() => { if (ws && ws.readyState === 1) ws.send('{"type":"ping"}'); }, 25000);
})();
</script>
