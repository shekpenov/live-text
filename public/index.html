<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Урок — ввод текста</title>
<style>
  :root { --bg:#f4f6fb; --card:#fff; --text:#1c2333; --muted:#6b7385; --accent:#3b6cf6; --danger:#d93b3b; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 20px 16px; }
  .card { background:var(--card); border-radius:14px; padding:22px; box-shadow:0 2px 14px rgba(20,30,60,.08); }
  h1 { font-size: 22px; margin: 0 0 16px; }
  label { display:block; font-size:14px; color:var(--muted); margin:12px 0 6px; }
  input[type=text] { width:100%; padding:12px 14px; font-size:18px; border:1.5px solid #d5dae6; border-radius:10px; outline:none; }
  input[type=text]:focus, textarea:focus { border-color:var(--accent); }
  button { margin-top:18px; width:100%; padding:13px; font-size:17px; border:0; border-radius:10px; background:var(--accent); color:#fff; cursor:pointer; }
  button:hover { filter:brightness(1.07); }
  .err { color:var(--danger); font-size:14px; min-height:20px; margin-top:10px; }
  .bar { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  .who { font-weight:600; }
  .status { font-size:13px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .dot { width:9px; height:9px; border-radius:50%; background:#2fb36b; }
  .dot.off { background:#e09a1a; }
  textarea { width:100%; height:60vh; min-height:260px; padding:14px; font-size:18px; line-height:1.5; border:1.5px solid #d5dae6; border-radius:10px; outline:none; resize:vertical; font-family: inherit; }
  textarea:disabled { background:#eceef4; color:#7a8195; }
  .lock { display:none; background:#fff3d6; color:#7a5200; padding:10px 14px; border-radius:10px; margin-bottom:12px; font-size:14px; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="wrap">

  <div id="join" class="card">
    <h1>Вход на урок</h1>
    <label for="code">Код комнаты</label>
    <input id="code" type="text" inputmode="numeric" maxlength="4" placeholder="1234" autocomplete="off">
    <label for="name">Ваше имя</label>
    <input id="name" type="text" maxlength="40" placeholder="Имя Фамилия" autocomplete="off">
    <button id="joinBtn">Войти</button>
    <div class="err" id="err"></div>
  </div>

  <div id="work" class="card hidden">
    <div class="bar">
      <div class="who" id="who"></div>
      <div class="status"><span class="dot" id="dot"></span><span id="stText">подключено</span></div>
    </div>
    <div class="lock" id="lockMsg">Учитель заблокировал ввод.</div>
    <textarea id="area" placeholder="Пишите здесь..." spellcheck="false"></textarea>
  </div>

</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const ERR = {
    room_not_found: 'Комната с таким кодом не найдена',
    name_required: 'Введите имя',
    room_full: 'В комнате нет мест'
  };

  let ws = null;
  let state = JSON.parse(localStorage.getItem('lt_student') || 'null'); // {code,name,id}
  let joined = false;
  let sendTimer = null;
  let closedByKick = false;

  function wsUrl() {
    return (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;
  }

  function setStatus(online) {
    $('dot').classList.toggle('off', !online);
    $('stText').textContent = online ? 'подключено' : 'нет связи, переподключаюсь...';
  }

  function connect() {
    ws = new WebSocket(wsUrl());
    ws.onopen = () => {
      ws.send(JSON.stringify({ type: 'student_join', code: state.code, name: state.name, id: state.id }));
    };
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === 'student_ready') {
        state.id = m.id;
        localStorage.setItem('lt_student', JSON.stringify(state));
        joined = true;
        $('join').classList.add('hidden');
        $('work').classList.remove('hidden');
        $('who').textContent = state.name + ' · комната ' + state.code;
        // не затираем то, что ученик успел набрать оффлайн
        if ($('area').value === '' || m.text !== '') $('area').value = m.text;
        applyLock(m.locked);
        setStatus(true);
        if ($('area').value !== m.text) sendNow();
      } else if (m.type === 'lock') {
        applyLock(m.locked);
      } else if (m.type === 'set_text') {
        $('area').value = m.text;
      } else if (m.type === 'kicked') {
        closedByKick = true;
        localStorage.removeItem('lt_student');
        alert('Вас отключил учитель.');
        location.reload();
      } else if (m.type === 'error') {
        if (m.reason === 'room_not_found') localStorage.removeItem('lt_student');
        $('err').textContent = ERR[m.reason] || 'Ошибка';
        if (joined) location.reload();
        closedByKick = true;
        ws.close();
      }
    };
    ws.onclose = () => {
      if (closedByKick) return;
      setStatus(false);
      setTimeout(connect, 1500);
    };
  }

  function applyLock(locked) {
    $('area').disabled = !!locked;
    $('lockMsg').style.display = locked ? 'block' : 'none';
  }

  function sendNow() {
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'text', text: $('area').value }));
  }

  $('area').addEventListener('input', () => {
    clearTimeout(sendTimer);
    sendTimer = setTimeout(sendNow, 120);
  });

  $('joinBtn').addEventListener('click', start);
  ['code', 'name'].forEach((id) => $(id).addEventListener('keydown', (e) => { if (e.key === 'Enter') start(); }));

  function start() {
    const code = $('code').value.trim();
    const name = $('name').value.trim();
    if (!/^\d{4}$/.test(code)) { $('err').textContent = 'Код — 4 цифры'; return; }
    if (!name) { $('err').textContent = 'Введите имя'; return; }
    $('err').textContent = '';
    state = { code, name, id: (state && state.code === code && state.name === name) ? state.id : null };
    closedByKick = false;
    connect();
  }

  // Автовход после обновления страницы
  if (state && state.code && state.name) {
    $('code').value = state.code;
    $('name').value = state.name;
    connect();
  }

  // Keep-alive, чтобы хостинг не обрывал соединение
  setInterval(() => { if (ws && ws.readyState === 1) ws.send('{"type":"ping"}'); }, 25000);
})();
</script>
</body>
</html>
